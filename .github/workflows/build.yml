name: Compilar APK

# Cada cambio en main compila Pepino+, pasa las pruebas, lo firma con app/pepino.p12 y lo publica en Releases como
# PepinoPlus.apk. La app comprueba esas versiones y se actualiza sola (etiqueta vN = número de compilación = versionCode).
# En cualquier otra rama solo compila y pasa las pruebas: sirve para comprobar los cambios sin publicar nada.
on:
  push:
    branches: [ '**', '!registro' ]
  workflow_dispatch:

permissions:
  contents: write

# Una compilación cada vez y en orden, para que una antigua no quede como «última versión».
# En las ramas de prueba, una compilación nueva cancela la anterior de esa rama (no publica nada).
concurrency:
  group: compilar-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceptar licencias del Android SDK
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5

      # Aplicación de Trakt: secreto TRAKT_CLIENT_ID (obligatorio para Trakt) y TRAKT_CLIENT_SECRET (opcional; las apps
      # nuevas de Trakt usan PKCE y no tienen secreto). Sin TRAKT_CLIENT_ID, Trakt queda desactivado.
      - name: Claves de Trakt
        env:
          TRAKT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          {
            printf 'traktClientId=%s\n' "$TRAKT_ID"
            printf 'traktClientSecret=%s\n' "$TRAKT_SECRET"
            printf 'traktRedirectUri=urn:ietf:wg:oauth:2.0:oob\n'
          } > local.properties
          chmod 600 local.properties

      # Copia de Android que usan las pruebas con Robolectric (Android 15). Se descarga aquí, con reintentos, y se
      # guarda entre compilaciones: si la bajaba cada prueba por su cuenta, a veces fallaba la descarga.
      - name: Copia de Android para las pruebas (caché)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-android-all-15-robolectric-12650502-i7

      - name: Copia de Android para las pruebas (descarga)
        run: |
          V=15-robolectric-12650502-i7
          D=~/.m2/repository/org/robolectric/android-all-instrumented/$V
          if [ ! -s "$D/android-all-instrumented-$V.jar" ]; then
            mkdir -p "$D"
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 -o "$D/android-all-instrumented-$V.jar" \
              "https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$V/android-all-instrumented-$V.jar"
          fi
          ls -l "$D"

      # Pruebas automáticas (reglas de fuentes, perfiles, subtítulos, Trakt...). Si alguna falla no se publica nada.
      - name: Pruebas
        run: |
          chmod +x gradlew
          set -o pipefail
          # En serie (sin paralelo): las pruebas con Robolectric descargan su copia de Android y, si varias lo hacen a la
          # vez, chocan entre sí. --continue: si algo falla, salen todos los fallos de una vez.
          if ! ./gradlew testDebugUnitTest :core:model:test :core:domain:test --continue --no-parallel --no-daemon -PbuildNumber=${{ github.run_number }} 2>&1 | tee test.log; then
            grep -E " FAILED$|^e: |Execution failed for task" -A2 test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Compilar
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Falta el secreto SIGNING_PASSWORD (contraseña de la llave de firma) en Settings → Secrets and variables → Actions"
            exit 1
          fi
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew :app:assembleRelease --stacktrace --no-daemon -PbuildNumber=${{ github.run_number }} 2>&1 | tee build.log; then
            { grep -E "^e: " build.log; grep -E "error:|ERROR:|What went wrong" -A3 build.log; } | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      # Si falla, el registro se guarda en la rama «registro» (para poder leerlo sin entrar en GitHub).
      - name: Guardar registro si falla
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/reg
          cp build.log test.log /tmp/reg/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan registro-tmp
          git rm -rf --quiet . || true
          git clean -fdxq
          cp /tmp/reg/* . 2>/dev/null || echo "sin registro" > build.log
          git add -A
          git commit -m "Registro de la compilación ${{ github.run_number }}"
          git push -f origin HEAD:registro

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk PepinoPlus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PepinoPlus-apk
          path: PepinoPlus.apk

      - name: Publicar versión descargable
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Pepino+ ${{ github.run_number }}
          make_latest: true
          body: ${{ github.event.head_commit.message }}
          files: PepinoPlus.apk
